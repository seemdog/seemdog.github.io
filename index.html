<style>
  :root {
    --bg: #fbfaf7;

    --text: #1c1c1e;
    --muted: #6d6d73;
    --line: #e9e6e0;
    --edge: #d8d4cc;
    --dot: #ece9e3;
    --accent: #3b5bdb;
    --accent-soft: #eef1fd;
    --chip: #f3f1ed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113;
      --surface: #18181b;
      --text: #ececef;
      --muted: #9b9ba3;
      --line: #2a2a2f;
      --edge: #3a3a41;
      --dot: #222226;
      --accent: #91a7ff;
      --accent-soft: #1d2340;
      --chip: #222226;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111113;
    --surface: #18181b;
    --text: #ececef;
    --muted: #9b9ba3;
    --line: #2a2a2f;
    --edge: #3a3a41;
    --dot: #222226;
    --accent: #91a7ff;
    --accent-soft: #1d2340;
    --chip: #222226;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15.5px/1.65 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button { font: inherit; color: inherit; }

  .wrap { position: relative; max-width: 860px; margin: 0 auto; padding: 80px 24px 56px; }

  /* ---------- Hero ---------- */
  .hero { display: grid; grid-template-columns: 152px 1fr; gap: 40px; align-items: start; }
  .photo {
    width: 152px; height: 152px; border-radius: 30px; overflow: hidden;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
    font-size: 44px; font-weight: 600; line-height: 1;
    box-shadow: 0 0 0 1px var(--line), 0 18px 40px -24px rgba(0,0,0,.45);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-size: 38px; font-weight: 700; line-height: 1.1;
    letter-spacing: -.02em; margin: 4px 0 10px;
  }
  .role { color: var(--muted); margin: 0 0 20px; font-size: 14.5px; }
  .bio p { margin: 0 0 12px; }
  .bio b { font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .icon-link {
    display: inline-grid; place-items: center;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--text);
    transition: border-color .15s, color .15s, transform .15s;
  }
  .icon-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; transform: translateY(-1px); }
  .icon-link svg { width: 17px; height: 17px; display: block; }

  /* ---------- Sections ---------- */
  section { margin-top: 76px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px 16px; flex-wrap: wrap;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  h2 { font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; margin: 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }

  /* ---------- Research map ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent; background: var(--chip);
    font-size: 12.5px; font-weight: 500; transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--line); }
  .chip.on { background: var(--surface); border-color: currentColor; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip small { color: var(--muted); font-weight: 400; }

  .graph {
    position: relative; width: 100%; min-height: 200px;
    border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
    background-color: var(--surface);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
    background-size: 18px 18px;
  }
  .graph svg { display: block; touch-action: none; }
  .graph .edge { stroke: var(--edge); stroke-linecap: round; transition: opacity .2s; }
  .graph .node { cursor: pointer; transition: opacity .2s; }
  .graph .node circle { fill-opacity: .16; stroke-width: 1.5; transition: fill-opacity .2s, stroke-width .2s; }
  .graph .node:hover circle, .graph .node.on circle { fill-opacity: .45; stroke-width: 2.5; }
  .graph text {
    fill: var(--text); font: 500 12px Inter, sans-serif; pointer-events: none;
    paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round;
  }
  .graph .dim { opacity: .14; }
  .cloud { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px; }

  /* ---------- Publications ---------- */
  .filter { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .filter b { color: var(--text); font-weight: 600; }
  .clear {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; cursor: pointer;
  }
  .clear:hover { border-color: var(--accent); color: var(--accent); }
  .pubs { list-style: none; margin: 0; padding: 0; }
  .year {
    margin: 30px 0 4px; color: var(--muted);
    font-size: 12px; font-weight: 600; letter-spacing: .1em;
  }
  .pub {
    display: grid; grid-template-columns: 92px 1fr; gap: 20px;
    padding: 16px 0; border-bottom: 1px dashed var(--line);
    animation: fade .3s ease both;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .venue {
    align-self: start; text-align: center;
    padding: 4px 8px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
  }
  .ptitle { font-weight: 600; line-height: 1.42; }
  .ptitle a { color: var(--text); }
  .ptitle a:hover { color: var(--accent); }
  .award {
    display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 6px;
    font-size: 11px; font-weight: 600; vertical-align: 2px;
    color: #b35c00; background: #fff1de;
  }
  :root[data-theme="dark"] .award { color: #ffb562; background: #3a2a14; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .award { color: #ffb562; background: #3a2a14; } }
  .status {
    display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 6px;
    font-size: 11px; font-weight: 600; vertical-align: 2px;
    color: var(--muted); background: var(--chip); border: 1px solid var(--line);
  }
  .authors { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .authors .me { color: var(--text); font-weight: 600; }
  .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; }
  .plinks { display: flex; gap: 12px; font-size: 13px; font-weight: 500; }
  .kws { display: flex; flex-wrap: wrap; gap: 5px; }
  .kws .chip { padding: 1px 9px; font-size: 11.5px; }
  .empty { color: var(--muted); padding: 24px 0; }

  footer { margin-top: 72px; color: var(--muted); font-size: 12.5px; }

  .theme-toggle {
    position: absolute; top: 24px; right: 24px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; font-size: 15px; line-height: 1;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  @media (max-width: 640px) {
    .wrap { padding: 64px 16px 40px; }
    .theme-toggle { top: 16px; right: 16px; }
    .hero { grid-template-columns: 1fr; gap: 22px; }
    .photo { width: 112px; height: 112px; border-radius: 24px; font-size: 34px; }
    h1 { font-size: 32px; }
    section { margin-top: 56px; }
    .pub { grid-template-columns: 1fr; gap: 8px; }
    .venue { justify-self: start; }
  }
</style>
</head>

    github: `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`,
    email: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>`
  };
  $("#links").innerHTML = DATA.links.map((l) =>
    `<a class="icon-link" href="${esc(l.url)}" aria-label="${esc(l.label)}" title="${esc(l.label)}" target="_blank" rel="noopener">${ICONS[l.icon] || esc(l.label)}</a>`
  ).join("");
  const initials = DATA.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("");
  const ph = $("#photo");
  ph.textContent = initials;
  if (DATA.photo) {
    const img = new Image();
    img.alt = DATA.name;
    img.onload = () => { ph.textContent = ""; ph.appendChild(img); };
    img.src = DATA.photo;
  }
  $("#footer").innerHTML = `© ${new Date().getFullYear()} ${esc(DATA.name)} · Last updated ${esc(DATA.updated)}`;
  /* ---------- Filter state ---------- */
  let filter = null; // { type: "kw" | "area", value }
  const same = (a, b) => a && b && a.type === b.type && a.value === b.value;
  function matches(p) {
    if (!filter) return true;
    if (filter.type === "kw") return p.keywords.includes(filter.value);
    const a = DATA.areas.find((x) => x.name === filter.value);
    return p.keywords.some((k) => a.keywords.includes(k));
  }
  function setFilter(f) {
    filter = same(f, filter) ? null : f;
    renderLegend(); renderPubs(); updateGraphState();
  }

  /* ---------- Legend ---------- */
  function renderLegend() {
    $("#legend").innerHTML = DATA.areas.map((a) => {
      const n = DATA.papers.filter((p) => p.keywords.some((k) => a.keywords.includes(k))).length;
      const on = filter && filter.type === "area" && filter.value === a.name;
      return `<button class="chip${on ? " on" : ""}" data-area="${esc(a.name)}" style="${on ? `color:${a.color}` : ""}">
        <i style="background:${a.color}"></i><span style="color:var(--text)">${esc(a.name)}</span><small>${n}</small></button>`;
    }).join("");
  }
  $("#legend").addEventListener("click", (e) => {
    const b = e.target.closest("[data-area]");
    if (b) setFilter({ type: "area", value: b.dataset.area });
  });

  /* ---------- Publications ---------- */
  function pubHTML(p) {
    const authors = esc(p.authors).split(esc(DATA.me)).join(`<span class="me">${esc(DATA.me)}</span>`);
    const links = Object.entries(p.links || {}).map(([k, v]) =>
      `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join("");
    const kws = p.keywords.map((k) => {
      const on = filter && filter.type === "kw" && filter.value === k;
      return `<button class="chip${on ? " on" : ""}" data-kw="${esc(k)}" style="${on ? `color:${colorOf(k)}` : ""}"><i style="background:${colorOf(k)}"></i><span style="color:var(--text)">${esc(k)}</span></button>`;
    }).join("");
    const title = p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
    return `<li class="pub">
      <div class="venue">${esc(p.venue)}</div>
      <div>
        <div class="ptitle">${title}${p.award ? `<span class="award">${esc(p.award)}</span>` : ""}${p.status ? `<span class="status">${esc(p.status)}</span>` : ""}</div>
        <div class="authors">${authors}</div>
        <div class="prow"><div class="plinks">${links}</div><div class="kws">${kws}</div></div>
      </div>
    </li>`;
  }
  function renderPubs() {
    const list = DATA.papers.filter(matches).sort((a, b) => b.year - a.year);
    const years = [...new Set(list.map((p) => p.year))];
    $("#pubs").innerHTML = years.map((y) =>
      `<li class="year">${y}</li>` + list.filter((p) => p.year === y).map(pubHTML).join("")
    ).join("") || `<li class="empty">No papers match this keyword.</li>`;
    $("#filter").innerHTML = filter
      ? `<span>${list.length} of ${DATA.papers.length} · <b>${esc(filter.value)}</b></span><button class="clear" id="clear">Clear ✕</button>`
      : `<span>${DATA.papers.length} papers · ${DATA.papers.filter((p) => p.authors.startsWith(DATA.me)).length} first-author</span>`;
    const c = $("#clear");
    if (c) c.addEventListener("click", () => setFilter(null));
  }
  $("#pubs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-kw]");
    if (b) setFilter({ type: "kw", value: b.dataset.kw });
  });

  /* ---------- Research map (D3 force graph) ---------- */
  function buildGraph() {
    const count = new Map(), pair = new Map();
    DATA.papers.forEach((p) => {
      const ks = [...new Set(p.keywords)];
      ks.forEach((k) => count.set(k, (count.get(k) || 0) + 1));
      for (let i = 0; i < ks.length; i++)
        for (let j = i + 1; j < ks.length; j++) {
          const key = [ks[i], ks[j]].sort().join("||");
          pair.set(key, (pair.get(key) || 0) + 1);
        }
    });
    const nb = new Map([...count.keys()].map((k) => [k, new Set([k])]));
    const links = [...pair].map(([key, w]) => {
      const [s, t] = key.split("||");
      nb.get(s).add(t); nb.get(t).add(s);
      return { source: s, target: t, weight: w };
    });
    const nodes = [...count].map(([id, c]) => ({ id, count: c, area: areaOf(id), color: colorOf(id) }));
    return { nodes, links, nb };
  }

  let g = null, lastW = 0;
  function renderGraph() {
    const el = $("#graph");
    const W = el.clientWidth;
    if (!W || Math.abs(W - lastW) < 2) return;
    lastW = W;
    if (g) g.sim.stop();
    el.innerHTML = "";

    const { nodes, links, nb } = buildGraph();

    if (!window.d3) { // fallback: simple keyword cloud
      el.innerHTML = `<div class="cloud">${nodes.sort((a, b) => b.count - a.count).map((d) =>
        `<button class="chip" data-kw="${esc(d.id)}" style="font-size:${11 + d.count * 2}px"><i style="background:${d.color}"></i>${esc(d.id)} <small>${d.count}</small></button>`
      ).join("")}</div>`;
      el.onclick = (e) => { const b = e.target.closest("[data-kw]"); if (b) setFilter({ type: "kw", value: b.dataset.kw }); };
      g = null;
      return;
    }

    const small = W < 560;
    const H = small ? 380 : 430;
    const maxC = d3.max(nodes, (d) => d.count) || 1;
    const R = d3.scaleSqrt().domain([1, maxC]).range([7, small ? 19 : 25]);
    const anchors = {};
    DATA.areas.forEach((a, i, arr) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / arr.length;
      anchors[a.name] = { x: W / 2 + Math.cos(ang) * W * 0.24, y: H / 2 + Math.sin(ang) * H * 0.26 };
    });
    nodes.forEach((d) => {
      const a = d.area && anchors[d.area.name];
      d.ax = a ? a.x : W / 2; d.ay = a ? a.y : H / 2;
      d.x = d.ax + (Math.random() - 0.5) * 40; d.y = d.ay + (Math.random() - 0.5) * 40;
      d.lw = d.id.length * 6.6;
    });

    const svg = d3.select(el).append("svg")
      .attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`)
      .attr("role", "img").attr("aria-label", "Map of research keywords");

    const link = svg.append("g").selectAll("line").data(links).join("line")
      .attr("class", "edge").attr("stroke-width", (d) => 0.8 + d.weight * 1.1);

    const node = svg.append("g").selectAll("g").data(nodes).join("g")
      .attr("class", "node")
      .on("mouseenter", (e, d) => hover(d))
      .on("mouseleave", () => hover(null))
      .on("click", (e, d) => setFilter({ type: "kw", value: d.id }));

    node.append("circle").attr("r", (d) => R(d.count))
      .style("fill", (d) => d.color).style("stroke", (d) => d.color);
    node.append("text").attr("text-anchor", "middle").attr("dy", (d) => R(d.count) + 14).text((d) => d.id);
    node.append("title").text((d) => `${d.id} — ${d.count} paper${d.count > 1 ? "s" : ""}`);

    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id((d) => d.id)
        .distance((l) => 64 + (l.source.area !== l.target.area ? 46 : 0))
        .strength((l) => Math.min(0.9, 0.08 + 0.08 * l.weight)))
      .force("charge", d3.forceManyBody().strength(small ? -90 : -130))
      .force("collide", d3.forceCollide((d) => R(d.count) + Math.min(34, d.lw * 0.32) + 6).iterations(2))
      .force("x", d3.forceX((d) => d.ax).strength(0.09))
      .force("y", d3.forceY((d) => d.ay).strength(0.12))
      .on("tick", () => {
        nodes.forEach((d) => {
          const r = R(d.count), mx = Math.max(r, d.lw / 2) + 6;
          d.x = Math.max(mx, Math.min(W - mx, d.x));
          d.y = Math.max(r + 6, Math.min(H - r - 22, d.y));
        });
        link.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
        node.attr("transform", (d) => `translate(${d.x},${d.y})`);
      });

    node.call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

    g = { sim, node, link, nb };
    updateGraphState();
  }

  function hover(d) {
    if (!g) return;
    if (!d) return updateGraphState();
    const near = g.nb.get(d.id);
    g.node.classed("dim", (n) => !near.has(n.id));
    g.link.classed("dim", (l) => l.source.id !== d.id && l.target.id !== d.id);
  }

  function updateGraphState() {
    if (!g) return;
    const inArea = (d) => d.area && d.area.name === filter.value;
    g.node
      .classed("on", (d) => !!filter && (filter.type === "kw" ? d.id === filter.value : inArea(d)))
      .classed("dim", (d) => !!filter && (filter.type === "kw" ? !g.nb.get(filter.value).has(d.id) : !inArea(d)));
    g.link.classed("dim", (l) => !!filter && (filter.type === "kw"
      ? l.source.id !== filter.value && l.target.id !== filter.value
      : !(inArea(l.source) && inArea(l.target))));
  }

  /* ---------- Init ---------- */
  renderLegend();
  renderPubs();
  renderGraph();
  let t;
  if ("ResizeObserver" in window) {
    new ResizeObserver(() => { clearTimeout(t); t = setTimeout(renderGraph, 150); }).observe($("#graph"));
  } else {
    addEventListener("resize", () => { clearTimeout(t); t = setTimeout(renderGraph, 150); });
  }
})();
</script>
</body>
</html>
